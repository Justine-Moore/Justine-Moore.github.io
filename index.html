<style>
/* Colors: change these tokens to restyle the whole site. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --tint: #f5f8f8;
  --fg: #1d2523;
  --muted: #637069;
  --line: #e2e8e6;
  --teal: #0b7a75;
  --teal-soft: #e4f3f1;
  --coral: #d9534f;
  --coral-soft: #fceceb;
  --gold: #b97a12;
  --gold-soft: #fbf1dd;
  --on-teal: #ffffff;
  --display: "DM Serif Display", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* The site is always white (no dark mode). */
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14.5px; line-height: 1.55; }
h1, h2, h3, p, ul { margin: 0; }
a { color: var(--teal); text-decoration: none; font-weight: 600; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
svg.i { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* cover */
.cover { height: clamp(120px, 18vw, 170px); background: var(--teal-soft) center / cover no-repeat; overflow: hidden; }
.cover svg { width: 100%; height: 100%; display: block; }
.cover.has-image svg { display: none; }

/* page grid: intro card + tabs */
.page { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 0 32px; }
@media (max-width: 860px) { .page { grid-template-columns: minmax(0, 1fr); } }

/* intro card */
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: -56px; position: relative; display: grid; gap: 14px; min-width: 0; }
.avatar { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--teal); background: var(--teal-soft) center / cover no-repeat; display: grid; place-items: center; font-family: var(--display); font-size: 2rem; color: var(--teal); }
.intro h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
.creds { color: var(--teal); font-weight: 700; margin-top: 2px; }
.role { color: var(--muted); margin-top: 6px; }
.loc { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .88rem; margin-top: 6px; }
.btns { display: grid; gap: 8px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem; border: 1px solid var(--teal); color: var(--teal); background: transparent; }
.btn.fill { background: var(--teal); color: var(--on-teal); }
.btn:hover { opacity: .85; }
.contact { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .88rem; }
.contact div { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.contact .i { color: var(--coral); }

/* tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px; margin-top: 18px; background: var(--tint); border: 1px solid var(--line); border-radius: 14px; }
.tab { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 .9rem var(--body); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--teal); box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0,0,0,.05); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 14px; min-height: 440px; }
.panel[hidden] { display: none; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin-bottom: 14px; }
h3 { font-size: .95rem; line-height: 1.35; }
.sub { color: var(--muted); font-size: .86rem; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }

/* icon chips (tone cycles teal, coral, gold) */
.ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); font-size: 1.15rem; flex: none; }
.t1 .ico, .ico.t1 { background: var(--coral-soft); color: var(--coral); }
.t2 .ico, .ico.t2 { background: var(--gold-soft); color: var(--gold); }

/* overview */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 18px; }
.stat { background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.7rem; line-height: 1.1; }
.stat span.l { color: var(--muted); font-size: .8rem; line-height: 1.3; display: block; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { background: var(--teal-soft); color: var(--teal); font-weight: 700; font-size: .8rem; padding: 5px 12px; border-radius: 999px; }
.badge.plain { background: var(--tint); color: var(--fg); border: 1px solid var(--line); font-weight: 600; }

/* impact */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.card { background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.metric { font-family: var(--display); font-size: 1.7rem; line-height: 1; color: var(--teal); }
.t1 .metric { color: var(--coral); } .t2 .metric { color: var(--gold); }
.card p { color: var(--muted); font-size: .82rem; line-height: 1.45; }
.card a { font-size: .82rem; margin-top: 4px; }

/* experience */
.exp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .exp { grid-template-columns: minmax(0, 1fr); } }
.jobs-list { display: grid; gap: 8px; }
.jobs-list button { text-align: left; font: inherit; color: var(--fg); background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.jobs-list button b { font-size: .92rem; line-height: 1.3; }
.jobs-list button span { color: var(--muted); font-size: .8rem; }
.jobs-list button:hover { border-color: var(--teal); }
.jobs-list button.on { background: var(--teal-soft); border-color: var(--teal); box-shadow: inset 4px 0 0 var(--teal); }
.job-detail { background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-height: 280px; }
.job-detail p.sum { margin-top: 10px; font-size: .9rem; }
.job ul { padding-left: 18px; margin-top: 10px; }
.job li { margin-block: 5px; font-size: .88rem; }
.job li::marker { color: var(--teal); }
.cur { display: inline-block; background: var(--teal-soft); color: var(--teal); font-size: .7rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
.tl { border-left: 2px solid var(--line); margin-left: 5px; display: grid; gap: 16px; }
.tl div { position: relative; padding-left: 20px; }
.tl div::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--coral); }

/* columns used by credentials and research */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
.list { display: grid; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; }
.pub { padding-block: 10px; border-top: 1px solid var(--line); display: grid; gap: 3px; font-size: .88rem; }
.pub:first-child { border-top: 0; padding-top: 0; }
footer { text-align: center; color: var(--muted); font-size: .82rem; padding-block: 22px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .panel:not([hidden]) { animation: swap .25s ease; } @keyframes swap { from { opacity: 0; transform: translateY(6px); } } }
</style>

function showJob(i) {
  const j = S.experience[i];
  $("jobDetail").innerHTML = `<h3 style="font-size:1.1rem">${j.role}${j.current ? '<span class="cur">Current</span>' : ""}</h3><p class="sub">${j.org} · ${j.dates}</p>${j.summary ? `<p class="sum">${j.summary}</p>` : ""}<ul>${(j.bullets || []).map(b => `<li>${b}</li>`).join("")}</ul>`;
  [...$("jobs").children].forEach((b, k) => b.classList.toggle("on", k === i));
}
[...$("jobs").children].forEach((b, k) => { b.onclick = () => showJob(k); });
showJob(0);

$("edu").innerHTML = S.education.map((e, i) => `<div class="row ${tone(i)}"><span class="ico">${icon(e.icon)}</span><div><h3>${e.title}</h3><p class="sub">${e.sub}</p></div></div>`).join("");
$("certList").innerHTML = S.certifications.map(c => `<span class="badge">${c}</span>`).join("");
$("affilList").innerHTML = S.affiliations.map(a => `<span class="badge plain">${a}</span>`).join("");
$("pubs").innerHTML = S.publications.map(p => `<div class="pub"><p>${p.text}</p>${p.link ? `<a href="${p.link}"${ext(p.link)}>Read publication</a>` : ""}</div>`).join("");
$("pres").innerHTML = S.presentations.map(t => `<span class="badge plain">${t}</span>`).join("");
$("honorList").innerHTML = S.honors.map((h, i) => `<div class="row ${tone(i + 1)}"><span class="ico">${icon("award")}</span><div><h3>${h.title}</h3>${h.sub ? `<p class="sub">${h.sub}</p>` : ""}</div></div>`).join("");

/* tabs: built from the panels above */
const panels = [...document.querySelectorAll(".panel")];
const tabs = $("tabs");
function show(i) {
  panels.forEach((p, k) => { p.hidden = k !== i; });
  [...tabs.children].forEach((b, k) => b.setAttribute("aria-selected", k === i));
  try { history.replaceState(null, "", "#" + slug(panels[i])); } catch (e) {}
}
const slug = p => p.dataset.title.toLowerCase().replace(/[^a-z]+/g, "");
panels.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
  b.innerHTML = icon(p.dataset.icon) + p.dataset.title;
  b.onclick = () => show(i);
  tabs.appendChild(b);
});
const start = panels.findIndex(p => "#" + slug(p) === location.hash);
show(start < 0 ? 0 : start);
</script>
