<style>
/* Colors: change these tokens to restyle the whole site. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --fg: #1d2523;
  --muted: #627069;
  --line: #e3e7e5;
  --primary: #0b6e68;
  --primary-soft: #eef4f3;
  --teal: #0b6e68;
  --teal-soft: #eef4f3;
  --tint: #f6f8f7;
  --cover-a: #0d5f5a;
  --cover-b: #123f3d;
  --on-primary: #ffffff;
  --display: "DM Serif Display", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121514; --surface: #1a1e1d; --fg: #eceeed; --muted: #9ba5a3; --line: #2c3331;
    --primary: #5cc2b8; --primary-soft: #1f2d2b; --teal: #5cc2b8; --teal-soft: #1f2d2b; --tint: #161a19;
    --cover-a: #0d4a46; --cover-b: #0f2f2d; --on-primary: #0f1514; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121514; --surface: #1a1e1d; --fg: #eceeed; --muted: #9ba5a3; --line: #2c3331;
  --primary: #5cc2b8; --primary-soft: #1f2d2b; --teal: #5cc2b8; --teal-soft: #1f2d2b; --tint: #161a19;
  --cover-a: #0d4a46; --cover-b: #0f2f2d; --on-primary: #0f1514; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; }
h1, h2, h3, h4, p, ul { margin: 0; }
a { color: var(--primary); text-decoration: none; }
a:focus-visible, .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
svg.i { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* top nav */
nav { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
nav .wrap { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; padding-block: 12px; }
nav b { margin-right: auto; display: flex; align-items: center; gap: 8px; color: var(--primary); }
nav a { color: var(--muted); font-weight: 500; font-size: .9rem; }
nav a:hover { color: var(--primary); }

/* cover */
.cover { height: clamp(150px, 24vw, 230px); position: relative; overflow: hidden; background: linear-gradient(110deg, var(--cover-a), var(--cover-b)) center / cover no-repeat; }
.cover svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover.has-image svg { display: none; }

/* profile header */
.profile { background: var(--surface); border-bottom: 1px solid var(--line); }
.profile .wrap { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: flex-end; padding-bottom: 24px; }
.avatar { width: 124px; height: 124px; border-radius: 50%; border: 5px solid var(--surface); margin-top: -62px; background: var(--primary-soft) center / cover no-repeat; display: grid; place-items: center; font-family: var(--display); font-size: 2.6rem; color: var(--primary); flex: none; }
.who { flex: 1 1 280px; min-width: 0; }
.who h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 5vw, 2.5rem); line-height: 1.15; }
.who .creds { color: var(--teal); font-weight: 700; }
.who .title { color: var(--muted); margin-top: 2px; }
.who .loc { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; margin-top: 6px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; border: 1px solid var(--primary); color: var(--primary); background: transparent; }
.btn.fill { background: var(--primary); color: var(--on-primary); }
.btn:hover { opacity: .85; }

/* layout */
main .wrap { padding-block: 28px 40px; display: grid; gap: 24px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-size: 1.35rem; flex: none; }
.ico.teal { background: var(--teal-soft); color: var(--teal); }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
.stat span { color: var(--muted); font-size: .85rem; line-height: 1.3; display: block; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 24px; min-width: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.box > h2 { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
.box > h2 .ico { width: 34px; height: 34px; border-radius: 9px; font-size: 1.05rem; }
.sub { color: var(--muted); font-size: .88rem; }

/* experience */
.job { position: relative; padding: 0 0 22px 24px; border-left: 2px solid var(--line); margin-left: 6px; }
.job:last-child { padding-bottom: 0; border-left-color: transparent; }
.job::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--teal); }
.job.now::before { background: var(--teal); }
.job h3 { font-size: 1rem; }
.job ul { margin-top: 8px; padding-left: 18px; }
.job li { margin-block: 4px; }
.job li::marker { color: var(--teal); }

/* initiative cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; background: var(--tint); }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .metric { font-family: var(--display); font-size: 1.8rem; line-height: 1; color: var(--teal); }
.card h3 { font-size: .95rem; }
.card p { color: var(--muted); font-size: .86rem; }
.card .more { margin-top: auto; padding-top: 6px; font-weight: 600; font-size: .85rem; }

/* sidebar lists */
.list { display: grid; gap: 14px; }
.list .row { display: flex; gap: 12px; }
.list .row .ico { width: 38px; height: 38px; font-size: 1.1rem; }
.list h3 { font-size: .93rem; line-height: 1.35; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { background: var(--teal-soft); color: var(--teal); font-weight: 700; font-size: .82rem; padding: 6px 12px; border-radius: 999px; }
.badge.blue { background: var(--tint); color: var(--fg); border: 1px solid var(--line); font-weight: 600; }
.pub { display: flex; flex-direction: column; gap: 4px; padding-block: 12px; border-top: 1px solid var(--line); }
.pub:first-of-type { border-top: 0; padding-top: 0; }
.pub a { font-weight: 600; font-size: .88rem; }
.contact-line { display: flex; align-items: center; gap: 10px; overflow-wrap: anywhere; }
.contact-line .ico { width: 34px; height: 34px; font-size: 1rem; }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding-block: 24px; border-top: 1px solid var(--line); background: var(--surface); }
</style>
