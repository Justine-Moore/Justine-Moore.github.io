<style>
/* Colors: change these tokens to restyle the whole site. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --tint: #f5f8f8;
  --fg: #1d2523;
  --muted: #637069;
  --line: #e2e8e6;
  --teal: #0b7a75;
  --teal-soft: #e4f3f1;
  --coral: #d9534f;
  --coral-soft: #fceceb;
  --gold: #b97a12;
  --gold-soft: #fbf1dd;
  --on-teal: #ffffff;
  --display: "DM Serif Display", Georgia, serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* The site is always white (no dark mode). */
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14.5px; line-height: 1.55; }
h1, h2, h3, p, ul { margin: 0; }
a { color: var(--teal); text-decoration: none; font-weight: 600; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
svg.i { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }

/* cover */
.cover { height: clamp(120px, 18vw, 170px); background: var(--teal-soft) center / cover no-repeat; overflow: hidden; }
.cover svg { width: 100%; height: 100%; display: block; }
.cover.has-image svg { display: none; }

/* page grid: intro card + tabs */
.page { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 0 32px; }
@media (max-width: 860px) { .page { grid-template-columns: minmax(0, 1fr); } }

/* intro card */
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: -56px; position: relative; display: grid; gap: 14px; min-width: 0; }
.avatar { width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--teal); background: var(--teal-soft) center / cover no-repeat; display: grid; place-items: center; font-family: var(--display); font-size: 2rem; color: var(--teal); }
.intro h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; }
.creds { color: var(--teal); font-weight: 700; margin-top: 2px; }
.role { color: var(--muted); margin-top: 6px; }
.loc { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .88rem; margin-top: 6px; }
.btns { display: grid; gap: 8px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem; border: 1px solid var(--teal); color: var(--teal); background: transparent; }
.btn.fill { background: var(--teal); color: var(--on-teal); }
.btn:hover { opacity: .85; }
.contact { display: grid; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .88rem; }
.contact div { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
.contact .i { color: var(--coral); }

/* tabs */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px; margin-top: 18px; background: var(--tint); border: 1px solid var(--line); border-radius: 14px; }
.tab { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 .9rem var(--body); cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--teal); box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(0,0,0,.05); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 14px; min-height: 440px; }
.panel[hidden] { display: none; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin-bottom: 14px; }
h3 { font-size: .95rem; line-height: 1.35; }
.sub { color: var(--muted); font-size: .86rem; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }

/* icon chips (tone cycles teal, coral, gold) */
.ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); font-size: 1.15rem; flex: none; }
.t1 .ico, .ico.t1 { background: var(--coral-soft); color: var(--coral); }
.t2 .ico, .ico.t2 { background: var(--gold-soft); color: var(--gold); }

/* overview */
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { background: var(--teal-soft); color: var(--teal); font-weight: 700; font-size: .8rem; padding: 5px 12px; border-radius: 999px; }
.badge.plain { background: var(--tint); color: var(--fg); border: 1px solid var(--line); font-weight: 600; }

/* impact */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.card { background: var(--tint); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.card .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.metric { font-family: var(--display); font-size: 1.7rem; line-height: 1; color: var(--teal); }
.t1 .metric { color: var(--coral); } .t2 .metric { color: var(--gold); }
.card p { color: var(--muted); font-size: .82rem; line-height: 1.45; }
.card a { font-size: .82rem; margin-top: 4px; }

/* experience */
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.seg button { font: 600 .9rem var(--body); padding: 9px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--tint); color: var(--muted); cursor: pointer; }
.seg button:hover { border-color: var(--teal); color: var(--fg); }
.seg button[aria-selected="true"] { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.gallery figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.gallery img, .ph { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; display: block; }
.ph { background: var(--tint); border: 2px dashed var(--line); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: .8rem; }
.ph .i { width: 2em; height: 2em; }
.gallery figcaption { font-size: .88rem; font-weight: 600; text-align: center; }
.gallery img { cursor: zoom-in; transition: transform .15s ease, box-shadow .15s ease; }
.gallery img:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.12); }

/* image pop-up (lightbox) */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(12, 22, 21, .9); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb[hidden] { display: none; }
.lb-view { margin: 0; display: grid; gap: 12px; justify-items: center; min-width: 0; }
.lb-view img { max-width: 100%; max-height: 78vh; object-fit: contain; border-radius: 10px; background: #fff; }
.lb-view figcaption { color: #fff; font-weight: 600; text-align: center; }
.lb-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; color: var(--fg); font: 700 1.5rem/1 var(--body); cursor: pointer; display: grid; place-items: center; }
.lb-btn:hover { background: var(--teal-soft); }
.lb-x { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
@media (max-width: 600px) { .lb { grid-template-columns: minmax(0, 1fr); } .lb-nav { position: absolute; bottom: max(16px, env(safe-area-inset-bottom, 0px)); } .lb-prev { left: 16px; } .lb-next { right: 16px; } }
.exp { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .exp { grid-template-columns: minmax(0, 1fr); } }
.job-main { background: var(--tint); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.job-main h3 { font-size: 1.25rem; }
.job-main h4 { margin: 18px 0 4px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }

.side { display: grid; gap: 10px; }
.mini { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }

.job ul { padding-left: 18px; margin-top: 10px; }

.cur { display: inline-block; background: var(--teal-soft); color: var(--teal); font-size: .7rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }

.list { display: grid; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; }
.pub { padding-block: 10px; border-top: 1px solid var(--line); display: grid; gap: 3px; font-size: .88rem; }

footer { text-align: center; color: var(--muted); font-size: .82rem; padding-block: 22px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .panel:not([hidden]) { animation: swap .25s ease; } @keyframes swap { from { opacity: 0; transform: translateY(6px); } } }

const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n] || P.check}"/></svg>`;
const $ = id => document.getElementById(id);
const ext = u => /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : "";
const tone = i => "t" + (i % 3);
const S = SITE;

$("name").textContent = S.name;
$("creds").textContent = S.creds;
$("title").textContent = S.title;
$("loc").innerHTML = icon("pin") + S.location;
$("footer").textContent = "© " + new Date().getFullYear() + " " + S.name;
if (S.cover) { $("cover").style.backgroundImage = `url("${S.cover}")`; $("cover").classList.add("has-image"); }
if (S.photo) { $("avatar").style.backgroundImage = `url("${S.photo}")`; } else { $("avatar").textContent = S.initials; }
$("heroLinks").innerHTML = S.heroLinks.filter(l => l.url).map(l => `<a class="btn ${l.primary ? "fill" : ""}" href="${l.url}"${ext(l.url)}>${icon(l.icon)}${l.label}</a>`).join("");
$("contactList").innerHTML = S.contact.map(c => `<div>${icon(c.icon)}<span>${c.text}</span></div>`).join("");

$("summary").textContent = S.summary;
$("skills").innerHTML = S.skills.map(t => `<span class="badge plain">${t}</span>`).join("");
/* impact: click a tab to see its photos */
const seg = $("impactTabs");
let curImpact = 0, lbIdx = 0, lbOpener = null;
/* image pop-up: click a photo to enlarge. Esc closes, arrow keys move between photos. */
const lbPhotos = () => S.impact[curImpact].photos.filter(p => p.src);
function lbRender() {
  const list = lbPhotos(), p = list[lbIdx];
  $("lbImg").src = p.src; $("lbImg").alt = p.caption; $("lbCap").textContent = p.caption;
  $("lbPrev").hidden = $("lbNext").hidden = list.length < 2;
}
function openLb(k) {
  lbIdx = k; lbOpener = document.activeElement; lbRender();
  $("lb").hidden = false; document.body.style.overflow = "hidden"; $("lbClose").focus();
}
function closeLb() {
  $("lb").hidden = true; document.body.style.overflow = "";
  if (lbOpener && lbOpener.focus) lbOpener.focus();
}
function stepLb(d) { const n = lbPhotos().length; lbIdx = (lbIdx + d + n) % n; lbRender(); }
$("lbClose").onclick = closeLb;
$("lbPrev").onclick = () => stepLb(-1);
$("lbNext").onclick = () => stepLb(1);
$("lb").onclick = e => { if (e.target === $("lb")) closeLb(); };
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowLeft" && lbPhotos().length > 1) stepLb(-1);
  else if (e.key === "ArrowRight" && lbPhotos().length > 1) stepLb(1);
});
seg.innerHTML = S.impact.map(g => `<button type="button">${g.name}</button>`).join("");
function showImpact(i) {
  $("gallery").innerHTML = S.impact[i].photos.map(p => `<figure>${p.src ? `<img src="${p.src}" alt="${p.caption}">` : `<div class="ph"><div>${icon("image")}<br>Photo goes here</div></div>`}<figcaption>${p.caption}</figcaption></figure>`).join("");
  [...seg.children].forEach((b, k) => b.setAttribute("aria-selected", k === i));
  curImpact = i;
  $("gallery").querySelectorAll("img").forEach((im, k) => {
    im.tabIndex = 0; im.setAttribute("role", "button");
    im.onclick = () => openLb(k);
    im.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(k); } };
  });
}
[...seg.children].forEach((b, k) => { b.onclick = () => showImpact(k); });
showImpact(0);

/* experience: one large role, the rest small on the side */
const main = S.experience.find(j => j.main) || S.experience[0];
$("jobMain").innerHTML = `<h3>${main.role}<span class="cur">Current</span></h3><p class="sub">${main.org} · ${main.location} · ${main.dates}</p>${main.summary ? `<p class="sum">${main.summary}</p>` : ""}${(main.sections || []).map(x => `<h4>${x.heading}</h4><ul>${x.bullets.map(b => `<li>${b}</li>`).join("")}</ul>`).join("")}`;
$("jobSide").innerHTML = S.experience.filter(j => j !== main).map(j => `<div class="mini"><b>${j.role}</b><span>${j.org}</span><span>${j.location}</span><span>${j.dates}</span></div>`).join("");

$("edu").innerHTML = S.education.map((e, i) => `<div class="row ${tone(i)}"><span class="ico">${icon(e.icon)}</span><div><h3>${e.title}</h3><p class="sub">${e.sub}</p></div></div>`).join("");
$("certList").innerHTML = S.certifications.map(c => `<span class="badge">${c}</span>`).join("");
$("affilList").innerHTML = S.affiliations.map(a => `<span class="badge plain">${a}</span>`).join("");
$("pubs").innerHTML = S.publications.map(p => `<div class="pub"><p>${p.text}</p>${p.link ? `<a href="${p.link}"${ext(p.link)}>Read publication</a>` : ""}</div>`).join("");
$("pres").innerHTML = S.presentations.map(t => `<span class="badge plain">${t}</span>`).join("");
$("honorList").innerHTML = S.honors.map((h, i) => `<div class="row ${tone(i + 1)}"><span class="ico">${icon("award")}</span><div><h3>${h.title}</h3>${h.sub ? `<p class="sub">${h.sub}</p>` : ""}</div></div>`).join("");

/* tabs: built from the panels above */
const panels = [...document.querySelectorAll(".panel")];
const tabs = $("tabs");
function show(i) {
  panels.forEach((p, k) => { p.hidden = k !== i; });
  [...tabs.children].forEach((b, k) => b.setAttribute("aria-selected", k === i));
  try { history.replaceState(null, "", "#" + slug(panels[i])); } catch (e) {}
}
const slug = p => p.dataset.title.toLowerCase().replace(/[^a-z]+/g, "");
panels.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
  b.innerHTML = icon(p.dataset.icon) + p.dataset.title;
  b.onclick = () => show(i);
  tabs.appendChild(b);
});
const start = panels.findIndex(p => "#" + slug(p) === location.hash);
show(start < 0 ? 0 : start);
</script>
